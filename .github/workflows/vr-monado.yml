name: VR Monado

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ master, develop, 'dev/*' ]
    paths:
      - 'eegnb/devices/vr.py'
      - 'tests/test_vr_monado.py'
      - 'tests/monado_remote.py'
      - 'requirements.txt'
      - '.github/workflows/vr-monado.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'eegnb/devices/vr.py'
      - 'tests/test_vr_monado.py'
      - 'tests/monado_remote.py'
      - 'requirements.txt'
      - '.github/workflows/vr-monado.yml'

jobs:
  monado:
    name: monado (ubuntu-26.04, py-3.12)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Install APT dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install monado-service libopenxr-loader1 libopenxr1-monado xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri libglu1-mesa
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PsychoPy, pyopenxr and test tooling
      run: |
        python -m pip install --upgrade pip
        pip install "$(grep -m1 '^psychopy' requirements.txt)" "$(grep -m1 '^pyopenxr' requirements.txt)" pytest pytest-cov nbval
    - name: Run Monado-backed VR tests
      run: |
        xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" pytest tests/test_vr_monado.py -v -rs 2>&1 | tee pytest.log
        if grep -Eq '[0-9]+ skipped' pytest.log; then
          echo "::error::tests/test_vr_monado.py was skipped, not run"
          exit 1
        fi
