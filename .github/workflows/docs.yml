name: Docs

on:
  push:
    branches: [ master, develop, 'dev/*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up conda env
      uses: ./.github/actions/setup-conda-env
      with:
        environment-file: environments/eeg-expy-docsbuild.yml
        activate-environment: eeg-expy-docsbuild

    - name: Get list of changed files
      id: changes
      run: |
        git fetch origin master
        git diff --name-only origin/master...HEAD > changed_files.txt
        cat changed_files.txt

    - name: Determine build mode
      id: mode
      run: |
        if grep -vqE '^examples/.*\.py$' changed_files.txt; then
          echo "FULL_BUILD=true" >> $GITHUB_ENV
          echo "Detected non-example file change. Full build triggered."
        else
          # || true prevents grep's exit code 1 (no matches) from aborting the step
          CHANGED_EXAMPLES=$(grep '^examples/.*\.py$' changed_files.txt | paste -sd '|' - || true)
          echo "FULL_BUILD=false" >> $GITHUB_ENV
          echo "CHANGED_EXAMPLES=$CHANGED_EXAMPLES" >> $GITHUB_ENV
          echo "Changed examples: $CHANGED_EXAMPLES"
        fi

    - name: Cache executed gallery examples
      id: cache-docs
      uses: actions/cache@v4
      with:
        # sphinx-gallery decides whether to re-run an example by comparing the
        # example's md5 against `<example>.py.md5` beside its generated rst in
        # doc/auto_examples, so that directory -- not the rendered html -- is
        # what makes a rebuild cheap.
        path: |
          doc/auto_examples
          doc/_build/doctrees
        # Two-part key. The prefix pins everything the per-example md5 cannot
        # see -- library, docs sources, docs environment -- so a prefix
        # fallback can only ever reuse stamps built against the same library,
        # and an example-only change still reuses the other examples' output.
        key: ${{ runner.os }}-sphinx-${{ hashFiles('eegnb/**/*.py', 'doc/**/*', 'environments/eeg-expy-docsbuild.yml') }}-${{ hashFiles('examples/**/*.py') }}
        restore-keys: |
          ${{ runner.os }}-sphinx-${{ hashFiles('eegnb/**/*.py', 'doc/**/*', 'environments/eeg-expy-docsbuild.yml') }}-

    - name: Build docs
      run: make docs

    - name: Upload built docs
      uses: actions/upload-artifact@v4
      with:
        name: docs-build-preview
        path: doc/_build/html
        retention-days: 14

    - name: Deploy Docs
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/master'  # TODO: Deploy seperate develop-version of docs?
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: doc/_build/html
